# (c) Qorix 2026
# GitHub Actions workflow to sync all repository collaborators/org members
# into the Assigned Reviewer dropdown in the Requirements Review issue template.
#
# Triggers:
#   - Every Monday at 08:00 UTC (keeps the list fresh as the team changes)
#   - Manually via workflow_dispatch (run immediately after adding a new member)
#
# Deploy to: .github/workflows/sync-repo-members.yml

name: Sync Repo Members to Issue Template

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday 08:00 UTC
  workflow_dispatch:        # Manual trigger from Actions tab

jobs:
  sync-members:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Needed to commit the updated YAML back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch collaborators and update reviewer dropdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, json, re, urllib.request

          token = os.environ["GITHUB_TOKEN"]
          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)

          # --- Fetch all collaborators (paginates automatically) ---
          logins = []
          page = 1
          while True:
              url = (
                  f"https://api.github.com/repos/{owner}/{repo}"
                  f"/collaborators?per_page=100&page={page}"
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  batch = json.load(resp)
              if not batch:
                  break
              logins.extend(m["login"] for m in batch)
              page += 1

          logins.sort(key=str.lower)
          print(f"Fetched {len(logins)} collaborators: {logins}")

          # --- Build the new options block ---
          options_lines = "\n".join(f"        - {login}" for login in logins)

          # --- Regex pattern: matches reviewer dropdown options in any template ---
          pattern = (
              r"(  - type: dropdown\n"
              r"    id: reviewer\n"
              r"    attributes:\n"
              r"      label: Assigned Reviewer\n"
              r"(?:      description:.*\n)?"
              r"      options:\n)"
              r"(?:        - .*\n)+"
          )
          replacement = r"\g<1>" + options_lines + "\n"

          # --- Update all issue template files that contain the reviewer dropdown ---
          templates = [
              ".github/ISSUE_TEMPLATE/requirements_review.yml",
              ".github/ISSUE_TEMPLATE/design_review.yml",
          ]
          for template_path in templates:
              with open(template_path, "r", encoding="utf-8") as f:
                  content = f.read()
              new_content, subs = re.subn(pattern, replacement, content)
              if subs == 0:
                  print(f"WARNING: reviewer dropdown not found in {template_path} — skipping.")
                  continue
              with open(template_path, "w", encoding="utf-8") as f:
                  f.write(new_content)
              print(f"Updated {template_path} reviewer dropdown with {len(logins)} members.")
          PYEOF

      - name: Commit updated template
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/requirements_review.yml
          git add .github/ISSUE_TEMPLATE/design_review.yml
          # Only commit if something actually changed
          git diff --staged --quiet \
            && echo "No changes — member list is already up to date." \
            || git commit -m "chore: sync repo collaborators to reviewer dropdown [skip ci]"

      - name: Push changes
        run: git push
