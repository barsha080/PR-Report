name: Review Automation

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  auto-review-comment:
    if: github.event.label.name == 'in-review'
    runs-on: ubuntu-latest

    steps:
      - name: Add Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              ...context.repo,
              issue_number
            });

            let round = 1;
            for (const c of comments.data) {
              if (c.body && c.body.includes("Round")) {
                round++;
              }
            }

            const today = new Date().toISOString().split('T')[0];

            const body =
            "## 🔍 Round " + round + " Review — [Reviewer Name] — " + today + " — Doc v[X.X]\n\n" +

            "### 📝 Feedback\n" +
            "- ID-1 — [Finding] — Open\n" +
            "- ID-2 — [Finding] — Accepted\n" +
            "- ID-3 — [Finding] — Rejected\n\n" +

            "👉 Add more like:\n" +
            "- ID-X — Finding — Open/Accepted/Rejected\n\n" +

            "### 🏁 Decision\n" +
            "- [ ] ✅ Approved\n" +
            "- [ ] 🔴 Changes Requested";

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number,
              body
            });
