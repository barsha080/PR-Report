name: Simple Review Automation

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  review-flow:
    runs-on: ubuntu-latest

    steps:
      - name: Handle Review Flow
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const label = context.payload.label.name;

            // Get existing comments
            const comments = await github.rest.issues.listComments({
              ...context.repo,
              issue_number
            });

            // Calculate round number
            let round = 1;
            for (const c of comments.data) {
              if (c.body && c.body.includes("Round")) {
                round++;
              }
            }

            const today = new Date().toISOString().split('T')[0];

            // 👉 CASE 1: Start Review
            if (label === "in-review") {

              const body =
              "## 🔍 Round " + round + " Review — " + today + "\n\n" +
              "Add your feedback below:\n" +
              "- ID-X — Finding — Open/Accepted/Rejected";

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body
              });
            }

            // 👉 CASE 2: Approved → Close Issue
            if (label === "approved") {

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: "✅ Approved. Closing this issue."
              });

              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: "closed"
              });
            }
