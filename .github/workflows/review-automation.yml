name: Review Automation

on:
  issues:
    types: [labeled]

jobs:
  auto-review-comment:
    if: github.event.label.name == 'in-review'
    runs-on: ubuntu-latest

    steps:
      - name: Generate Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;

            // 1. Get existing comments
            const comments = await github.rest.issues.listComments({
              ...context.repo,
              issue_number
            });

            // 2. Count previous rounds
            let round = 1;
            comments.data.forEach(c => {
              if (c.body.includes("Round")) {
                round++;
              }
            });

            // 3. Get current date
            const today = new Date().toISOString().split('T')[0];

            // 4. Template
            const body = `
## 🔍 Round ${round} Review — [Reviewer Name] — ${today} — Doc v[X.X]

| ID | Checkpoint | Status | Finding / Remark |
|----|-----------|--------|-----------------|
| SRS.1 | Document is as per template | ⬜ | — |
| SRS.2 | Title page updated | ⬜ | — |
| SRS.3 | Document change history maintained | ⬜ | — |
| SRS.4 | Introduction section is clear | ⬜ | — |
| SRS.5 | Abbreviations & definitions identified | ⬜ | — |
| SRS.6 | Reference documents identified | ⬜ | — |
| SRS.7 | Proper alignment maintained | ⬜ | — |
| SRS.8 | Hyperlinks are correct | ⬜ | — |
| SRS.9 | Font & size as per template | ⬜ | — |
| SRS.10 | No spelling/grammar issues | ⬜ | — |
| SRS.11 | Requirements are clear and unambiguous | ⬜ | — |
| SRS.12 | No conflicting requirements | ⬜ | — |
| SRS.13 | Requirements are testable | ⬜ | — |
| SRS.14 | Acceptance criteria defined | ⬜ | — |
| SRS.15 | Edge cases considered | ⬜ | — |
| SRS.16 | All functional requirements captured | ⬜ | — |
| SRS.17 | Non-functional requirements included | ⬜ | — |
| SRS.18 | Dependencies identified | ⬜ | — |
| SRS.19 | Assumptions documented | ⬜ | — |
| SRS.20 | Requirements mapped to Feature / User Story | ⬜ | — |
| SRS.21 | Traceability maintained | ⬜ | — |
| SRS.22 | No orphan requirements | ⬜ | — |

### 📌 Open Findings
- [ ] SRS.X — [describe finding]

### 🏁 Decision
- [ ] ✅ Approved
- [ ] 🔴 Changes Requested
`;

            // 5. Post comment
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number,
              body
            });
