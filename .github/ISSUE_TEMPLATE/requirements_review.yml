  # ---------------- REVIEWER COMMENT TEMPLATE ----------------
  - type: markdown
    attributes:
      value: |
        ---
        ## 💬 Step 2 — Reviewer: Post a Comment with Your Findings

        > After this issue is created, **copy the template below** into a new comment and fill in your findings.

        ```markdown
        ## 🔍 Review Findings — [Reviewer Name] — [YYYY-MM-DD]

        | ID | Checkpoint | Status | Finding / Remark |
        |----|-----------|--------|-----------------|
