name: Requirements Review
description: SRS / Requirements Review Checklist (SWE.1 compliant)
title: "[Requirement TRC] QD-XXX Requirements Review"
labels:
  - "requirement review"
  - "in-review"

body:

  - type: markdown
    attributes:
      value: |
        ## ?? Review Lifecycle
        **Author** creates issue ? **Reviewer** posts findings comment ? **Author** responds ? repeat until **Approved**

        Labels: `in-review` ? `rework-required` ? `re-review-requested` ? `approved`

        > ?? Copy-paste comment templates are in [REPLY_TEMPLATES.md](.github/ISSUE_TEMPLATE/REPLY_TEMPLATES.md)
        ---

  - type: input
    id: jira
    attributes:
      label: Jira Sub-task ID
      placeholder: QD-123
    validations:
      required: true

  - type: input
    id: doc_version
    attributes:
      label: Document Version Under Review
      placeholder: "e.g. v1.2"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope of Review
      description: What feature / module is being reviewed
    validations:
      required: true

  - type: dropdown
    id: author
    attributes:
      label: Author (Document Owner)
      options:
        - Indranil Saha
        - Janekallu Raghukumar
        - Mayur Agarwal
        - Pranavi Patil
        - Dhanush K
        - Sudheendra Desai
        - Rohit Malla
        - Sumegh Thale
        - Utsav
        - Sridhar
        - Syeeda
        - Ananda Nadarajan S
        - Saraswati Chaurasiya
        - Shiva Kakkirala
        - Hiteshwar Molabanti
        - Barsha Sahi
        - Suresh Chamuah
        - Ciby Bastian
    validations:
      required: true

  - type: dropdown
    id: reviewer
    attributes:
      label: Assigned Reviewer
      options:
        - Indranil Saha
        - Janekallu Raghukumar
        - Mayur Agarwal
        - Pranavi Patil
        - Dhanush K
        - Sudheendra Desai
        - Rohit Malla
        - Sumegh Thale
        - Utsav
        - Sridhar
        - Syeeda
        - Ananda Nadarajan S
        - Saraswati Chaurasiya
        - Shiva Kakkirala
        - Hiteshwar Molabanti
        - Barsha Sahi
        - Suresh Chamuah
        - Ciby Bastian
    validations:
      required: true

  - type: input
    id: review_date
    attributes:
      label: Review Requested Date
      placeholder: "YYYY-MM-DD"
    validations:
      required: true

  - type: textarea
    id: remarks
    attributes:
      label: Author Notes for Reviewer
      description: Context, changes since last review, or specific areas to focus on
      placeholder: Add notes for the reviewer here

  - type: markdown
    attributes:
      value: "---\n### ? Author Pre-check — tick items you have verified before submitting"

  - type: checkboxes
    id: general_checks
    attributes:
      label: "General"
      options:
        - label: "SRS.1 — Document is as per template"
        - label: "SRS.2 — Title page updated (title, version, date, config ID)"
        - label: "SRS.3 — Document change history is maintained"
        - label: "SRS.4 — Introduction section is clear"
        - label: "SRS.5 — Abbreviations & definitions identified"
        - label: "SRS.6 — Reference documents identified"

  - type: checkboxes
    id: formatting_checks
    attributes:
      label: "Formatting & Structure"
      options:
        - label: "SRS.7 — Proper alignment maintained"
        - label: "SRS.8 — Hyperlinks are correct"
        - label: "SRS.9 — Font & size as per template"
        - label: "SRS.10 — No spelling/grammar issues"

  - type: checkboxes
    id: quality_checks
    attributes:
      label: "Requirement Quality"
      options:
        - label: "SRS.11 — Requirements are clear and unambiguous"
        - label: "SRS.12 — No conflicting requirements"
        - label: "SRS.13 — Requirements are testable"
        - label: "SRS.14 — Acceptance criteria defined"
        - label: "SRS.15 — Edge cases considered"

  - type: checkboxes
    id: completeness_checks
    attributes:
      label: "Completeness"
      options:
        - label: "SRS.16 — All functional requirements captured"
        - label: "SRS.17 — Non-functional requirements included"
        - label: "SRS.18 — Dependencies identified"
        - label: "SRS.19 — Assumptions documented"

  - type: checkboxes
    id: traceability_checks
    attributes:
      label: "Traceability"
      options:
        - label: "SRS.20 — Requirements mapped to Feature / User Story"
        - label: "SRS.21 — Traceability maintained"
        - label: "SRS.22 — No orphan requirements"

  - type: dropdown
    id: result
    attributes:
      label: Author Self-Assessment
      options:
        - Ready for review
        - Partially ready — known gaps exist
    validations:
      required: true
