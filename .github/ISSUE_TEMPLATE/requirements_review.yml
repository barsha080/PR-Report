        ```

        ---
        ## ✍️ Step 3 — Author: Post an Acceptance Response

        > After the reviewer posts findings, **copy the template below** into a new comment and mark each finding.

        ```markdown
        ## ✅ Author Response — [Author Name] — [YYYY-MM-DD]

        | Finding | Decision | Action / Comment |
        |---------|----------|-----------------|
        | SRS.3 — Change history missing v1.2 | ✅ Accepted | Will update in v1.3 |
        | SRS.5 — Acronym XYZ not defined | ✅ Accepted | Added to abbreviations table |
        | SRS.8 — Link in Section 3.2 broken | ✅ Accepted | Fixed |
        | SRS.11 — REQ-005 ambiguous | ❌ Not Accepted | REQ-005 is intentionally broad per SWE.1 scope |
        | SRS.14 — REQ-009 missing criteria | ✅ Accepted | Criteria added |
        | SRS.17 — Performance NFR missing | ✅ Accepted | NFR section updated |
        | SRS.20 — REQ-017 not linked | ✅ Accepted | Linked to US-042 |
        ```
        ---
      label: Review Result
      options:
        - Approved
        - Approved with comments
        - Rework required
