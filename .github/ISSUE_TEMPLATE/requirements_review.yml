name: Requirements Review
description: SRS / Requirements Review Checklist (SWE.1 compliant)
title: "[Requirement TRC] QD-XXX Requirements Review"
labels:
  - "requirement review"
  - "in-review"

body:

  - type: markdown
    attributes:
      value: |
        ## Review Lifecycle

        | Step | Who | Action | Label to set |
        |------|-----|--------|--------------|
        | 1 | Author | Creates this issue, fills form, assigns Reviewer via **Assignees** | `in-review` |
        | 2 | Reviewer | Posts findings using **Round N Review** template as a comment | `rework-required` or `approved` |
        | 3 | Author | Responds to each finding, posts **Rework Complete** comment, re-assigns Reviewer | `re-review-requested` |
        | 4 | Reviewer | Re-reviews, posts **Final Approval** comment, closes issue | `approved` |

        > Copy-paste comment templates: [REPLY_TEMPLATES.md](.github/ISSUE_TEMPLATE/REPLY_TEMPLATES.md)

        **How to request review:** After creating the issue, use the **Assignees** field (top-right sidebar) to assign the reviewer.
        **How to approve:** Reviewer adds label `approved` from the **Labels** sidebar and closes the issue.
        ---

  - type: input
    id: jira
    attributes:
      label: Jira Sub-task ID
      placeholder: QD-123
    validations:
      required: true

  - type: input
    id: doc_version
    attributes:
      label: Document Version Under Review
      placeholder: "e.g. v1.2"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope of Review
      description: What feature / module is being reviewed
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author (Document Owner)
      description: "Auto-populated with your GitHub username when the issue is created. Leave blank."
      placeholder: "Auto-filled on submission"

  - type: dropdown
    id: reviewer
    attributes:
      label: Assigned Reviewer
      description: "Select the reviewer. Also assign them via the Assignees sidebar (top-right) so they get a notification."
      options:
        - barsha080
        - savithas-qorix
    validations:
      required: true

  - type: input
    id: review_date
    attributes:
      label: Review Requested Date
      description: "Auto-populated with today's date when the issue is created. Leave blank."
      placeholder: "Auto-filled on submission"

  - type: textarea
    id: remarks
    attributes:
      label: Author Notes for Reviewer
      description: Context, changes since last review, or specific areas to focus on
      placeholder: Add notes for the reviewer here

  - type: markdown
    attributes:
      value: "---\n### Author Pre-check — tick items you have verified before submitting"

  - type: checkboxes
    id: general_checks
    attributes:
      label: "General"
      options:
        - label: "SRS.1 - Document is as per rst template"
        - label: "SRS.2 - Title page updated (title, version, date, config ID)"
        - label: "SRS.3 - Document change log is maintained"
        - label: "SRS.4 - Purpose & Scope is clear"
        - label: "SRS.5 - Abbreviations & definitions identified"
        - label: "SRS.6 - Relationship to parent document is identified & captured"

  - type: checkboxes
    id: formatting_checks
    attributes:
      label: "Formatting & Structure"
      options:
        - label: "SRS.7 - Proper alignment maintained as per rst"
        - label: "SRS.8 - Hyperlinks are correct"
        - label: "SRS.9 - No spelling/grammar issues"

  - type: checkboxes
    id: quality_checks
    attributes:
      label: "Requirement Quality"
      options:
        - label: "SRS.11 - Requirements are clear and unambiguous"
        - label: "SRS.12 - No conflicting/duplicate requirements"
        - label: "SRS.13 - Requirements are testable"
        - label: "SRS.14 - All parameters should be maintained for specific requirement"
        - label: "SRS.15 - Requirement type should be Function or Non Function"
        - label: "SRS.16 - Use SHALL / SHOULD / MAY per RFC 2119"
        - label: "SRS.17 - Requirement ID has to be unique"
        - label: "SRS.18 - Each requirement has :status: field (draft | reviewed | approved | Deprecated)"
        - label: "SRS.19 - Rationale field provided for each requirement"
        - label: "SRS.20 - Traceability matrix section or separate traceability.rst file included"

  - type: checkboxes
    id: completeness_checks
    attributes:
      label: "Completeness"
      options:
        - label: "SRS.18 - All functional requirements included"
        - label: "SRS.19 - Non-functional requirements included"
        - label: "SRS.20 - parent ID, Implemented by ID, Links incoming, Jira identified & captured"
        - label: "SRS.21 - Edge Cases to be identified/captured"

  - type: dropdown
    id: result
    attributes:
      label: Author Self-Assessment
      options:
        - Ready for review
        - Partially ready - known gaps exist
    validations:
      required: true
