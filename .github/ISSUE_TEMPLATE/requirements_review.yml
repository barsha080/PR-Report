name: Requirements Review
description: SRS / Requirements Review Checklist
title: "[Requirement TRC] QD-XXX Requirements Review"
labels:
  - "requirement review"

body:

  - type: input
    id: jira
    attributes:
      label: Jira Sub-task ID
      placeholder: QD-123
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope of Review
      description: What feature / module is being reviewed
    validations:
      required: true

  # ---------------- REVIEW METADATA TABLE ----------------
  - type: markdown
    attributes:
      value: |
        ---
        ### 📋 Review Participants

        | Role | Name | Date |
        |------|------|------|
        | **Author** (Document Owner) | _Fill in_ | _Fill in_ |
        | **Reviewer** | _Fill in_ | _Fill in_ |

        ---

  - type: input
    id: author
    attributes:
      label: Author (Document Owner)
      placeholder: Full name of the document author
    validations:
      required: true

  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      placeholder: Full name of the reviewer
    validations:
      required: true

  - type: input
    id: review_date
    attributes:
      label: Review Date
      placeholder: "YYYY-MM-DD"
    validations:
      required: true

  - type: textarea
    id: remarks
    attributes:
      label: General Remarks
      description: Any general remarks or context before starting the review
      placeholder: Add overall remarks here

  # ---------------- GENERAL ----------------
  - type: checkboxes
    id: general_checks
    attributes:
      label: "✅ General"
      options:
        - label: "SRS.1 — Document is as per template"
        - label: "SRS.2 — Title page updated (title, version, date, config ID)"
        - label: "SRS.3 — Document change history is maintained"
        - label: "SRS.4 — Introduction section is clear"
        - label: "SRS.5 — Abbreviations & definitions identified"
        - label: "SRS.6 — Reference documents identified"

  - type: textarea
    id: general_findings
    attributes:
      label: "📝 General — Findings"
      description: "List defects found. Each line: `- [ ] Finding description → Author: Name`"
      placeholder: "- [ ] Finding → Author: Name"

  # ---------------- FORMATTING ----------------
  - type: checkboxes
    id: formatting_checks
    attributes:
      label: "✅ Formatting & Structure"
      options:
        - label: "SRS.7 — Proper alignment maintained"
        - label: "SRS.8 — Hyperlinks are correct"
        - label: "SRS.9 — Font & size as per template"
        - label: "SRS.10 — No spelling/grammar issues"

  - type: textarea
    id: formatting_findings
    attributes:
      label: "📝 Formatting & Structure — Findings"
      description: "List defects found. Each line: `- [ ] Finding description → Author: Name`"
      placeholder: "- [ ] Finding → Author: Name"

  # ---------------- REQUIREMENT QUALITY ----------------
  - type: checkboxes
    id: quality_checks
    attributes:
      label: "✅ Requirement Quality"
      options:
        - label: "SRS.11 — Requirements are clear and unambiguous"
        - label: "SRS.12 — No conflicting requirements"
        - label: "SRS.13 — Requirements are testable"
        - label: "SRS.14 — Acceptance criteria defined"
        - label: "SRS.15 — Edge cases considered"

  - type: textarea
    id: quality_findings
    attributes:
      label: "📝 Requirement Quality — Findings"
      description: "List defects found. Each line: `- [ ] Finding description → Author: Name`"
      placeholder: "- [ ] Finding → Author: Name"

  # ---------------- COMPLETENESS ----------------
  - type: checkboxes
    id: completeness_checks
    attributes:
      label: "✅ Completeness"
      options:
        - label: "SRS.16 — All functional requirements captured"
        - label: "SRS.17 — Non-functional requirements included"
        - label: "SRS.18 — Dependencies identified"
        - label: "SRS.19 — Assumptions documented"

  - type: textarea
    id: completeness_findings
    attributes:
      label: "📝 Completeness — Findings"
      description: "List defects found. Each line: `- [ ] Finding description → Author: Name`"
      placeholder: "- [ ] Finding → Author: Name"

  # ---------------- TRACEABILITY ----------------
  - type: checkboxes
    id: traceability_checks
    attributes:
      label: "✅ Traceability"
      options:
        - label: "SRS.20 — Requirements mapped to Feature / User Story"
        - label: "SRS.21 — Traceability maintained"
        - label: "SRS.22 — No orphan requirements"

  - type: textarea
    id: traceability_findings
    attributes:
      label: "📝 Traceability — Findings"
      description: "List defects found. Each line: `- [ ] Finding description → Author: Name`"
      placeholder: "- [ ] Finding → Author: Name"

  # ---------------- REVIEW RESULT ----------------
  - type: dropdown
    id: result
    attributes:
      label: Review Result
      options:
        - Approved
        - Approved with comments
        - Rework required
    validations:
      required: true

  - type: textarea
    id: comments
    attributes:
      label: Overall Review Comments
      description: Summary of all findings / defects across sections
