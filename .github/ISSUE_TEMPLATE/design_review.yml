# (c) Qorix 2026
# GitHub Issue Form template for Software Design Description (SDD) Review.
# Checklist is aligned with ASPICE 4.0 SWE.3 work product requirements.
# Sub-checklist items from Book1.csv are consolidated into their parent TR_SDD label.
#
# Deploy to: .github/ISSUE_TEMPLATE/design_review.yml

name: Design Review
description: Software Design Description (SDD) Review Checklist (SWE.3 compliant)
title: "[Design TRC] QD-XXX Design Review"
labels:
  - "design review"
  - "in-review"

body:

  - type: markdown
    attributes:
      value: |
        ## Review Lifecycle

        | Step | Who | Action | Label to set |
        |------|-----|--------|--------------|
        | 1 | Author | Creates this issue, fills form, assigns Reviewer via **Assignees** | `in-review` |
        | 2 | Reviewer | Posts findings using **Round N Review** template as a comment | `rework-required` or `approved` |
        | 3 | Author | Responds to each finding, posts **Rework Complete** comment, re-assigns Reviewer | `re-review-requested` |
        | 4 | Reviewer | Re-reviews, posts **Final Approval** comment, closes issue | `approved` |

        > Copy-paste comment templates: [REPLY_TEMPLATES.md](.github/ISSUE_TEMPLATE/REPLY_TEMPLATES.md)

        **How to request review:** After creating the issue, use the **Assignees** field (top-right sidebar) to assign the reviewer.
        **How to approve:** Reviewer adds label `approved` from the **Labels** sidebar and closes the issue.
        ---

  - type: input
    id: jira
    attributes:
      label: Jira Sub-task ID
      placeholder: QD-123
    validations:
      required: true

  - type: input
    id: doc_version
    attributes:
      label: Document Version Under Review
      placeholder: "e.g. v1.2"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope of Review
      description: What module / component is being reviewed
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author (Document Owner)
      placeholder: "Your name"
    validations:
      required: true

  - type: dropdown
    id: reviewer
    attributes:
      label: Assigned Reviewer
      description: "Select the reviewer. Also assign them via the Assignees sidebar (top-right) so they get a notification."
      options:
        - barsha080
        - savithas-qorix
    validations:
      required: true

  - type: input
    id: review_date
    attributes:
      label: Review Requested Date
      placeholder: "YYYY-MM-DD"
    validations:
      required: true

  - type: textarea
    id: remarks
    attributes:
      label: Author Notes for Reviewer
      description: Context, changes since last review, or specific areas to focus on
      placeholder: Add notes for the reviewer here

  - type: markdown
    attributes:
      value: "---\n### Author Pre-check — tick items you have verified before submitting"

  # ---------------------------------------------------------------------------
  # Section 1: Document Structure & Meta-Information
  # ---------------------------------------------------------------------------
  - type: checkboxes
    id: doc_checks
    attributes:
      label: "1. Document Structure & Meta-Information"
      options:
        - label: "DOC.1 - Document header complete (ID, Version, Status, Owner, Approval)"
        - label: "DOC.2 - Change history/changelog with dates, authors, descriptions"
        - label: "DOC.3 - Parent documents referenced (SWE.1 requirements, SWE.2 architecture)"
        - label: "DOC.4 - Table of contents with correct depth"
        - label: "DOC.5 - Abbreviations/acronyms section present and complete"
        - label: "DOC.6 - Purpose and scope clearly defined"
        - label: "DOC.7 - RST source compiles cleanly (sphinx-build -W) with zero warnings"

  # ---------------------------------------------------------------------------
  # Section 2: Architecture & Module Structure
  # ---------------------------------------------------------------------------
  - type: checkboxes
    id: arch_checks
    attributes:
      label: "2. Architecture & Module Structure"
      options:
        - label: "ARCH.1 - Module decomposition diagrams present for all subsystems"
        - label: "ARCH.2 - Diagram notation explained (Mermaid/UML)"
        - label: "ARCH.3 - All modules have descriptive names"
        - label: "ARCH.4 - Module responsibilities documented"
        - label: "ARCH.5 - Performance constraints specified"

  # ---------------------------------------------------------------------------
  # Section 3: Module Specifications
  # ---------------------------------------------------------------------------
  - type: checkboxes
    id: mod_checks
    attributes:
      label: "3. Module Specifications"
      options:
        - label: "MOD.1 - Signature documented (parameters, return type)"
        - label: "MOD.2 - Purpose clearly stated"
        - label: "MOD.3 - Preconditions documented"
        - label: "MOD.4 - Postconditions documented"
        - label: "MOD.5 - Algorithm described (steps or pseudocode)"
        - label: "MOD.6 - Error cases documented"
        - label: "MOD.7 - SWE.1 requirement(s) traced"
        - label: "MOD.8 - Unit test ID(s) referenced"

  # ---------------------------------------------------------------------------
  # Section 4: Traceability
  # ---------------------------------------------------------------------------
  - type: checkboxes
    id: trace_checks
    attributes:
      label: "4. Traceability"
      options:
        - label: "TRACE.1 - Traceability matrix: SWE.3 → SWE.1"
        - label: "TRACE.2 - Traceability matrix: SWE.3 → SWE.4 (unit tests)"
        - label: "TRACE.3 - Every SWE.1 requirement covered by design element"
        - label: "TRACE.4 - Every design element traces to SWE.1 requirement"

  # ---------------------------------------------------------------------------
  # Section 5: Unit Test Specifications
  # ---------------------------------------------------------------------------
  - type: checkboxes
    id: test_checks
    attributes:
      label: "5. Unit Test Specifications"
      options:
        - label: "TEST.1 - All unit tests have unique IDs as per defined template"
        - label: "TEST.2 - Each test: description, SWE.1 ref, module, expected result"
        - label: "TEST.3 - Tests cover success and failure paths"
        - label: "TEST.4 - Boundary conditions tested"
        - label: "TEST.5 - Test coverage target specified (coverage TBD)"
        - label: "TEST.6 - Test tooling documented (cargo test, jest)"

  # ---------------------------------------------------------------------------
  # Section 6: Documentation Completeness
  # ---------------------------------------------------------------------------
  - type: checkboxes
    id: compl_checks
    attributes:
      label: "6. Documentation Completeness"
      options:
        - label: "COMPL.1 - No placeholder sections (remove \"TBD\", \"omitted\", \"TODO\" without tracking)"
        - label: "COMPL.2 - All purpose statements completed"
        - label: "COMPL.3 - All error cases documented"
        - label: "COMPL.4 - Open issues section up-to-date"

  # ---------------------------------------------------------------------------
  # Section 7: Validation & Error Handling
  # ---------------------------------------------------------------------------
  - type: checkboxes
    id: val_checks
    attributes:
      label: "7. Validation & Error Handling"
      options:
        - label: "VAL.1 - All validation rules have unique codes"
        - label: "VAL.2 - Each rule has severity level (Error, Warning, Info)"
        - label: "VAL.3 - Rule trigger conditions documented"
        - label: "VAL.4 - Actionable error messages documented"
        - label: "VAL.5 - Cross-file validation dependencies identified"

  # ---------------------------------------------------------------------------
  # Section 8: Code Quality
  # ---------------------------------------------------------------------------
  - type: checkboxes
    id: qa_checks
    attributes:
      label: "8. Code Quality"
      options:
        - label: "QA.1 - CI/CD checks"
        - label: "QA.2 - Code review requirements specified (approvals, CODEOWNERS)"
        - label: "QA.5 - Unsafe code policy documented"

  - type: dropdown
    id: result
    attributes:
      label: Author Self-Assessment
      options:
        - Ready for review
        - Partially ready - known gaps exist
    validations:
      required: true
